<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>FULL-STACK PROJECT</title>
  </head>
  <body>
    <!-- [mx-auto]-M is margin | X is direction for left and right | AUTO - is auto value   -->
    <div class="container mx-auto">
      <!-- font-size: var(--text-3xl); /* 1.875rem (30px)  adding utility-[text-3xl] -> to increase the FONTsize */  -->
      <!-- font-weight: 700; -> adding utility-[font-bold] the text should be in BOLD -->
      <!-- adding [px-5] | P-padding and X-left and right | 5-1.25rem = 20px -->
      <h1 class="text-3xl font-bold px-5">Hello World!</h1>
      <header>
        <!-- addig [h-screen]-height: 100vh; -->
         <!-- activating the GRID to add GRID in front of code and adding the [grid-cols-?]-NEXT  -->
        <section class="h-screen grid grid-cols-2">
          <div class="">
            <img src="./images/hand-drawn-flat-design-anarchy-symbol.zip" alt="">
          </div>
          <div class="bg-orange-700"></div>

        </section>

        <footer></footer>
      </header>
    </div>
  </body>
</html>
